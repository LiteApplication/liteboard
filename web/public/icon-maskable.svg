<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full-bleed background: maskable icons may be cropped to any shape. -->
  <rect width="512" height="512" fill="#0a0e14"/>
  <!-- Artwork kept inside the 80% safe zone (a 410px circle centred at 256,256). -->
  <g transform="translate(256 256) scale(4.6) translate(-32 -32)">
    <rect x="4" y="10" width="56" height="44" rx="11" fill="#111722" stroke="#1f2937" stroke-width="2"/>
    <rect x="4" y="10" width="56" height="44" rx="11" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
    <path d="M12 34 H22 L27 23 L34 43 L39 32 L43 37 H52"
          fill="none" stroke="url(#pulse)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="52" cy="37" r="2.6" fill="#5eead4" filter="url(#glow)"/>
  </g>
</svg>
